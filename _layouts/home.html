<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.name }}</title>
  <meta name="description" content="{{ page.bio }}" />
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <main class="container">
    <section class="card">
      <div class="avatar">{{ page.name | slice: 0 }}</div>

      <h1>{{ page.name }}</h1>
      <p class="bio">{{ page.bio }}</p>

      <div class="actions">
        <a class="btn primary" href="{{ page.github_url }}" target="_blank" rel="noopener noreferrer">
          Ver mi GitHub
        </a>
      </div>
    </section>
  </main>
</body>
</html>
