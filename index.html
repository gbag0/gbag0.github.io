<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tu Nombre</title>
  <meta
    name="description"
    content="Mini biografía personal con enlaces a GitHub y redes."
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-bg"></div>

  <main class="shell">
    <section class="hero-card">
      <div class="eyebrow">Disponible para proyectos</div>

      <h1>
        Hola, soy <span class="gradient-text">Tu Nombre</span>
      </h1>

      <p class="bio">
        test
      </p>

      <div class="actions">
        <a
          class="btn btn-primary"
          href="https://github.com/tuusuario"
          target="_blank"
          rel="noopener noreferrer"
        >
          Ver GitHub
        </a>

        <a class="btn btn-secondary" href="mailto:tuemail@ejemplo.com">
          Contacto
        </a>
      </div>

      <div class="links-panel">
        <a
          class="link-item"
          href="https://github.com/tuusuario"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="link-label">GitHub</span>
          <span class="link-value">@tuusuario</span>
        </a>

        <a
          class="link-item"
          href="https://x.com/tuusuario"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="link-label">X / Twitter</span>
          <span class="link-value">@tuusuario</span>
        </a>

        <a
          class="link-item"
          href="https://www.linkedin.com/in/tuusuario/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="link-label">LinkedIn</span>
          <span class="link-value">Perfil profesional</span>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
